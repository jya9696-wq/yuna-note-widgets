<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>YUNA 카드 (B+C+F)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Noto+Sans+KR:wght@800&display=swap" rel="stylesheet">
<style>
  /*
    학생 페이지 카드 3칸 위젯 · 시안 B+C+F
    (마우스를 올리면: 카드가 뜨고 → 파랑으로 바뀜 / 카드 전체가 링크)

    노션 임베드 주소:
      yuna-cards.html?nu=최근노트ID&cu=수업정리ID
        nu : 최근 노트 노션 페이지 ID (32자리, 매주 바뀜)
        cu : 오늘의 수업(수업 정리) 페이지 ID — 2번 칸 기본
        su : '내 능력치' 페이지 ID — cu 대신 주면 2번 칸이 '나의 능력치'로 바뀜(보류 중)
        lu : 자료실 ID (생략하면 윤아 자료실)
        y  : b → 단색 파랑 (노랑 포인트를 흰색으로)
        m  : light | dark  (생략하면 기기 설정을 따름)
        t  : new  → 항상 새 탭으로 열기
    블록 높이가 커도 카드는 비율(1.55:1)을 지키고 가운데에 놓임. 권장 높이 약 230px (휴대폰에서도 3칸 그대로, 글씨만 작아짐)
  */
  :root {
    --bg: #FFFFFF; --cb: #F1F1EF; --g: #7C828C; --line: #C9CBCF;
    --b: #1F92F9; --y: #F5B82E; --n: #0B1F66;
  }
  @media (prefers-color-scheme: dark) {
    :root:not(.light) { --bg: #191919; --cb: #2F2F2F; --g: #9A9FA8; --line: #4A4D52; }
  }
  :root.dark { --bg: #191919; --cb: #2F2F2F; --g: #9A9FA8; --line: #4A4D52; }

  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden;
    -webkit-font-smoothing: antialiased; }
  .row { box-sizing: border-box; height: 100%; padding: 18px 12px 12px;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: clamp(10px, 3vw, 28px); align-content: center; }

  .card { position: relative; display: flex; flex-direction: column; min-width: 0;
    box-sizing: border-box; text-decoration: none; color: inherit; cursor: pointer;
    background: var(--cb); border-radius: 10px; aspect-ratio: 1.55 / 1; max-height: calc(100vh - 30px);
    padding: clamp(10px, 2.2vw, 22px) clamp(10px, 2.4vw, 26px);
    transition: transform .25s ease, box-shadow .25s ease, background .25s ease; outline: none;
    -webkit-tap-highlight-color: transparent; }
  .top { display: flex; justify-content: space-between; align-items: center; }
  .tag { font: 400 clamp(9px, 1.25vw, 13px) "DM Mono", monospace; color: var(--g); letter-spacing: 1px; transition: color .25s; }
  .chk { width: clamp(11px, 1.5vw, 16px); height: clamp(11px, 1.5vw, 16px); box-sizing: border-box;
    border: 2px solid var(--b); display: flex; align-items: center; justify-content: center; transition: all .25s; }
  .chk svg { width: 75%; height: 75%; opacity: 0; transition: opacity .2s; }
  .t { font: 800 clamp(12px, 2vw, 21px) "Noto Sans KR", sans-serif; color: var(--b);
    margin-top: clamp(3px, .6vw, 6px); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transition: color .25s; }
  .rule { height: 2px; background: var(--line); margin-top: clamp(4px, .8vw, 8px); transition: background .25s; }
  .blks { display: flex; gap: 3px; justify-content: flex-end; margin-top: 5px; }
  .blk { width: clamp(7px, 1.2vw, 13px); height: clamp(3px, .45vw, 5px); background: var(--g); transition: background .25s; }
  .blk.b { background: var(--b); }
  .num { font: 500 clamp(30px, 6.4vw, 66px)/1 "DM Mono", monospace; color: var(--b); letter-spacing: -.06em;
    margin-top: auto; font-feature-settings: "zero" 1; transition: color .25s; }
  .bar { width: 26%; max-width: 44px; height: clamp(3px, .4vw, 4px); background: var(--b); margin-top: 5px;
    transition: width .35s ease, max-width .35s ease, background .25s; }

  /* B 들어올림 + C 파랑 반전 (꺾쇠는 뺌) */
  .card:hover, .card:focus-visible, .card.press {
    transform: translateY(-6px); background: var(--b); box-shadow: 0 14px 28px rgba(0,0,0,.18); }
  .card:hover .t, .card:hover .num, .card:focus-visible .t, .card:focus-visible .num,
  .card.press .t, .card.press .num { color: #fff; }
  .card:hover .tag, .card:focus-visible .tag, .card.press .tag { color: #D6EBFF; }
  .card:hover .rule, .card:focus-visible .rule, .card.press .rule { background: rgba(255,255,255,.5); }
  .card:hover .chk, .card:focus-visible .chk, .card.press .chk { background: var(--y); border-color: var(--y); }
  .card:hover .chk svg, .card:focus-visible .chk svg, .card.press .chk svg { opacity: 1; }
  .card:hover .blk, .card:focus-visible .blk, .card.press .blk { background: #fff; }
  .card:hover .bar, .card:focus-visible .bar, .card.press .bar { width: 100%; max-width: 100%; background: var(--y); }

  /* y=b → 단색 파랑 (노랑 포인트 대신 흰색) */
  :root.mono .card:hover .chk, :root.mono .card:focus-visible .chk, :root.mono .card.press .chk { background: #fff; border-color: #fff; }
  :root.mono .chk path { stroke: var(--b); }
  :root.mono .card:hover .bar, :root.mono .card:focus-visible .bar, :root.mono .card.press .bar { background: #fff; }
  @media (hover: none) { .card:hover { transform: none; background: var(--cb); box-shadow: none; } }
</style>
</head>
<body>
<div class="row">
  <a class="card" id="c1" href="#" aria-label="최근 노트 열기">
    <div class="top"><span class="tag">[ #01 ]</span><span class="chk"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8" fill="none" stroke="#0B1F66" stroke-width="2.6"/></svg></span></div>
    <div class="t">최근 노트</div><div class="rule"></div>
    <div class="blks"><span class="blk b"></span><span class="blk b"></span><span class="blk"></span><span class="blk"></span></div>
    <div class="num">01</div><div class="bar"></div>
  </a>
  <a class="card" id="c2" href="#" aria-label="오늘의 수업 열기">
    <div class="top"><span class="tag">[ #02 ]</span><span class="chk"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8" fill="none" stroke="#0B1F66" stroke-width="2.6"/></svg></span></div>
    <div class="t" id="t2">오늘의 수업</div><div class="rule"></div>
    <div class="blks"><span class="blk b"></span><span class="blk b"></span><span class="blk"></span><span class="blk"></span></div>
    <div class="num">02</div><div class="bar"></div>
  </a>
  <a class="card" id="c3" href="#" aria-label="윤아 자료실 열기">
    <div class="top"><span class="tag">[ #03 ]</span><span class="chk"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 8.5l3.5 3.5 7.5-8" fill="none" stroke="#0B1F66" stroke-width="2.6"/></svg></span></div>
    <div class="t">윤아 자료실</div><div class="rule"></div>
    <div class="blks"><span class="blk b"></span><span class="blk b"></span><span class="blk"></span><span class="blk"></span></div>
    <div class="num">03</div><div class="bar"></div>
  </a>
</div>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  if (q.get('y') === 'b') document.documentElement.classList.add('mono');
  if (q.get('m') === 'dark') document.documentElement.classList.add('dark');
  if (q.get('m') === 'light') document.documentElement.classList.add('light');
  var ok = function (v) { return /^[0-9a-fA-F]{32}$/.test(v || ''); };
  // 2번 칸: cu(오늘의 수업)가 기본, su(나의 능력치)를 주면 능력치 칸으로 바뀜
  var c2id = q.get('cu'), skill = !ok(c2id) && ok(q.get('su'));
  if (skill) { c2id = q.get('su'); document.getElementById('t2').textContent = '나의 능력치'; document.getElementById('c2').setAttribute('aria-label', '나의 능력치 열기'); }
  var ids = { c1: q.get('nu'), c2: c2id, c3: ok(q.get('lu')) ? q.get('lu') : '2e3e06f7164681c2b8fceaa1e5f005c5' };
  var newTab = q.get('t') === 'new';
  Object.keys(ids).forEach(function (k) {
    var el = document.getElementById(k);
    if (!ok(ids[k])) { el.removeAttribute('href'); el.style.opacity = '.5'; el.style.cursor = 'default'; return; }
    var url = 'https://www.notion.so/' + ids[k];
    el.href = url;
    el.target = newTab ? '_blank' : '_top';
    el.rel = 'noopener';
    el.addEventListener('click', function (e) {
      el.classList.add('press');
      if (newTab) return;
      e.preventDefault();
      try { window.top.location.href = url; }
      catch (err) { window.open(url, '_blank', 'noopener'); }
    });
    el.addEventListener('touchstart', function () { el.classList.add('press'); }, { passive: true });
  });
})();
</script>
</body>
</html>
