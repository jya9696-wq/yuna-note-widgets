<!doctype html><html lang="ko"><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
#h{position:relative;width:470px;height:56px;display:flex;align-items:center;
  font-family:"Noto Sans CJK KR",sans-serif;color:#4F6EF0}
.num{font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-style:italic;
  font-size:33px;letter-spacing:-0.01em;line-height:1;width:57px;padding-left:1px;transform:scaleX(1.08);transform-origin:left center}
.div{width:1px;height:31px;background:rgba(80,109,241,.35);margin:0 17px 0 3px}
.txt{display:flex;flex-direction:column;justify-content:center;white-space:nowrap}
.eb{font-family:"Inter Display","Inter",sans-serif;font-weight:900;font-style:italic;
  font-size:10.8px;letter-spacing:.135em;line-height:1;margin-bottom:4px}
.tt{font-size:20.5px;font-weight:900;letter-spacing:-.02em;line-height:1.1}
.line{flex:1;height:2px;margin-left:24px;margin-top:2px;
  background:linear-gradient(90deg,#4F6EF0 0%,#4F9BEA 50%,#4FC8E4 100%)}
</style></head><body>
<div id="h"><div class="num">{{NUM}}</div><div class="div"></div>
<div class="txt"><div class="eb">{{EB}}</div><div class="tt">{{TT}}</div></div><div class="line"></div></div>
</body></html>
