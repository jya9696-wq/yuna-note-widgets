<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>학생 페이지 머리 배너 v2</title>
<style>
  html, body { margin: 0; background: transparent; }
  .banner {
    position: relative;
    width: 740px;
    height: 156px;
    box-sizing: border-box;
    border-radius: 7px;
    overflow: hidden;
    background: linear-gradient(110deg, #3A45D6 0%, #4A63E0 42%, #5A8FE6 75%, #5EA9EA 100%);
    color: #FFFFFF;
    font-family: "Inter Display", "Inter", "Noto Sans CJK KR", sans-serif;
  }
  .accent { position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: #4FC6E9; }
  .main { position: absolute; left: 34px; top: 31px; right: 150px; }
  .label {
    display: flex; align-items: center; gap: 9px;
    font-weight: 900; font-style: italic;
    font-size: 12.5px; letter-spacing: 0.13em;
  }
  .label svg { width: 13px; height: 13px; }
  .name {
    margin-top: 2px;
    font-weight: 900;
    font-style: italic;
    font-size: 58px;
    line-height: 1.12;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .sub {
    margin-top: 4px;
    font-family: "Noto Sans CJK KR", sans-serif;
    font-size: 13.5px; font-weight: 700;
  }
  .side {
    position: absolute; top: 0; bottom: 0; right: 0; width: 124px;
    border-left: 1.5px dashed rgba(255,255,255,0.55);
    display: flex; align-items: center; justify-content: center;
  }
  .side svg { width: 64px; height: 64px; }
</style>
</head>
<body>
  <div class="banner" id="banner">
    <div class="accent"></div>
    <div class="main">
      <div class="label">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0Z"/></svg>
        YUNA ACADEMY
      </div>
      <div class="name">{{NAME}}</div>
      <div class="sub">수업 피드백 노트</div>
    </div>
    <div class="side">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <path d="M32 5 L39.6 22.4 L58.5 24.2 L44.2 36.8 L48.4 55.4 L32 45.8 L15.6 55.4 L19.8 36.8 L5.5 24.2 L24.4 22.4 Z"
              fill="rgba(255,255,255,0.22)" stroke="rgba(255,255,255,0.38)" stroke-width="4.5" stroke-linejoin="round"/>
      </svg>
    </div>
  </div>
</body>
</html>
