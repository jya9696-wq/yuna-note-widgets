<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>YUNA 바로가기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@1,800;1,900&family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
  /*
    07 바로가기 · QUICK LINKS (B안: 한 줄 띠)
    노션 임베드 주소:
    cards.html?nu=최근노트페이지ID&cu=수업정리페이지ID
      nu : 최근 노트 노션 페이지 ID (32자리)
      cu : 오늘의 수업 내용(수업 정리) 노션 페이지 ID
    윤아 자료실 링크는 고정.

    노션이 임베드 바깥에 흰 바탕을 깔기 때문에 띠가 블록 전체를 빈틈없이 채움.
    노션에서 블록 높이를 바꾸면 띠 높이도 따라감 (권장 약 90px, 휴대폰은 약 70px).
  */
  :root {
    color-scheme: light dark;
    --g1: #3A45D6; --g2: #4A63E0; --g3: #5A8FE6; --g4: #5EA9EA;
    --accent: #4FC6E9;
  }
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(105deg, var(--g1) 0%, var(--g2) 40%, var(--g3) 78%, var(--g4) 100%);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
    color: #fff;
  }
  .row {
    position: relative;
    box-sizing: border-box;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding-left: 6px;
  }
  .row::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 6px; background: var(--accent);
  }
  .item {
    position: relative;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    min-width: 0;
    padding: 0 20px 0 22px;
    color: inherit;
    text-decoration: none;
    transition: background .15s ease;
  }
  .item + .item::before {
    content: ""; position: absolute; left: 0; top: 20%; bottom: 20%;
    border-left: 1.5px dashed rgba(255,255,255,0.45);
  }
  .item:hover { background: rgba(255,255,255,0.08); }
  .text { min-width: 0; }
  .eyebrow {
    display: flex; align-items: center; gap: 6px;
    font-family: "Inter", sans-serif; font-style: italic; font-weight: 900;
    font-size: 10.5px; letter-spacing: 0.13em; white-space: nowrap;
    opacity: .95;
  }
  .eyebrow svg { width: 9px; height: 9px; flex: none; }
  .title {
    margin-top: 5px;
    font-size: 19px; font-weight: 900; letter-spacing: -0.02em; line-height: 1.2;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .go {
    flex: none;
    width: 28px; height: 28px; border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.85);
    display: flex; align-items: center; justify-content: center;
    transition: background .15s ease, color .15s ease;
  }
  .go svg { width: 13px; height: 13px; }
  .item:hover .go { background: #fff; color: var(--g1); }
  .item.disabled { pointer-events: none; opacity: .7; }

  /* 휴대폰처럼 좁은 화면: 소제목 숨기고, 화살표를 제목 아래로 */
  @media (max-width: 520px) {
    .row { padding-left: 4px; }
    .row::before { width: 4px; }
    .item { flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; padding: 0 10px 0 12px; }
    .eyebrow { display: none; }
    .title { margin-top: 0; font-size: 12.5px; white-space: normal; }
    .go { width: auto; height: auto; border: none; border-radius: 0; }
    .go svg { width: 12px; height: 12px; }
    .item:hover .go { background: none; color: inherit; }
  }
</style>
</head>
<body>
  <div class="row">
    <a class="item" id="c-note" target="_blank" rel="noopener">
      <div class="text">
        <div class="eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0Z"/></svg>LATEST NOTE</div>
        <div class="title">최근 노트</div>
      </div>
      <span class="go"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <a class="item" id="c-class" target="_blank" rel="noopener">
      <div class="text">
        <div class="eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0Z"/></svg>TODAY'S CLASS</div>
        <div class="title">오늘의 수업 내용</div>
      </div>
      <span class="go"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
    <a class="item" id="c-lib" target="_blank" rel="noopener" href="https://www.notion.so/2e3e06f7164681c2b8fceaa1e5f005c5">
      <div class="text">
        <div class="eyebrow"><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0Z"/></svg>LIBRARY</div>
        <div class="title">윤아 자료실</div>
      </div>
      <span class="go"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 8h9M8.5 4.5 12 8l-3.5 3.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
    </a>
  </div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    function link(id, pageId) {
      var el = document.getElementById(id);
      var v = (pageId || '').replace(/-/g, '');
      if (/^[0-9a-fA-F]{32}$/.test(v)) el.href = 'https://www.notion.so/' + v;
      else el.classList.add('disabled');
    }
    link('c-note', q.get('nu'));
    link('c-class', q.get('cu'));
  })();
</script>
</body>
</html>
