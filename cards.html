<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>YUNA 카드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@700;900&display=swap" rel="stylesheet">
<style>
  /*
    사용법 (노션 임베드 주소):
    cards.html?nu=최근노트페이지ID&cu=수업정리페이지ID
      nu : 최근 노트 노션 페이지 ID (32자리)
      cu : 오늘의 수업 내용(수업 정리) 노션 페이지 ID
    윤아 자료실 링크는 고정. 날짜는 표시하지 않음.

    노션이 임베드 바깥에 흰 바탕을 깔기 때문에, 위젯이 블록 전체를
    빈틈없이 채우도록 만듦. 노션에서 블록 높이를 바꾸면 띠 높이도 따라감.
  */
  :root {
    color-scheme: light dark;
    --g1: #3A45D6; --g2: #4A63E0; --g3: #5A8FE6; --g4: #5EA9EA;
    --accent: #4FC6E9;
  }
  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(110deg, var(--g1) 0%, var(--g2) 42%, var(--g3) 75%, var(--g4) 100%);
    font-family: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }
  .row {
    position: relative;
    box-sizing: border-box;
    height: 100%;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    padding-left: 5px;
  }
  .row::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent);
  }
  .card {
    position: relative;
    display: flex; align-items: center; gap: 9px;
    min-height: 0;
    padding: 0 16px 0 18px;
    color: #fff;
    text-decoration: none;
    white-space: nowrap;
    transition: background .15s ease;
  }
  .card + .card::before {
    content: ""; position: absolute; left: 0; top: 22%; bottom: 22%;
    border-left: 1.5px dashed rgba(255,255,255,0.5);
  }
  .card:hover { background: rgba(255,255,255,0.10); }
  .star { flex: none; width: 15px; height: 15px; }
  .title { flex: 1; font-size: 15px; font-weight: 900; letter-spacing: -0.01em; overflow: hidden; text-overflow: ellipsis; }
  .title .short { display: none; }
  .arrow { flex: none; font-size: 15px; font-weight: 900; opacity: .9; }
  .card.disabled { pointer-events: none; opacity: .75; }

  /* 휴대폰처럼 좁은 화면 */
  @media (max-width: 520px) {
    .row { padding-left: 3px; }
    .row::before { width: 3px; }
    .card { padding: 0 8px 0 10px; gap: 5px; }
    .star { width: 11px; height: 11px; }
    .title { font-size: 12px; }
    .title .full { display: none; }
    .title .short { display: inline; }
    .arrow { font-size: 12px; }
  }
</style>
</head>
<body>
  <div class="row">
    <a class="card" id="c-note" target="_blank" rel="noopener">
      <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0Z"/></svg>
      <span class="title"><span class="full">최근 노트</span><span class="short">최근 노트</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="card" id="c-class" target="_blank" rel="noopener">
      <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0Z"/></svg>
      <span class="title"><span class="full">오늘의 수업 내용</span><span class="short">수업 내용</span></span>
      <span class="arrow">→</span>
    </a>
    <a class="card" id="c-lib" target="_blank" rel="noopener" href="https://www.notion.so/2e3e06f7164681c2b8fceaa1e5f005c5">
      <svg class="star" viewBox="0 0 24 24" aria-hidden="true"><path fill="#FFFFFF" d="M12 0 C13 7.5 16.5 11 24 12 C16.5 13 13 16.5 12 24 C11 16.5 7.5 13 0 12 C7.5 11 11 7.5 12 0Z"/></svg>
      <span class="title"><span class="full">윤아 자료실</span><span class="short">자료실</span></span>
      <span class="arrow">→</span>
    </a>
  </div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    function link(cardId, pageId) {
      var card = document.getElementById(cardId);
      var id = (pageId || '').replace(/-/g, '');
      if (/^[0-9a-fA-F]{32}$/.test(id)) card.href = 'https://www.notion.so/' + id;
      else card.classList.add('disabled');
    }
    link('c-note', q.get('nu'));
    link('c-class', q.get('cu'));
  })();
</script>
</body>
</html>
